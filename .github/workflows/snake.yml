name: Generate Snake

on:
  schedule:
    # Avoid minute 0 where GitHub scheduled workflows are most prone to delay.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one snake per theme, in the same five tones as the 3D graph (conf/3d-contrib.json)
          outputs: |
            dist/snake-light.svg?color_dots=%23ededed,%23c9c9c9,%23969696,%23555555,%23111111&color_snake=%23000000&color_dot_border=%23ffffff
            dist/snake-dark.svg?color_dots=%232a2f36,%234b4f55,%237e8287,%23b9bcc0,%23ffffff&color_snake=%23ffffff&color_dot_border=transparent
      - name: Stand the day snake on white (snk emits a transparent SVG; night stays transparent)
        run: |
          f=dist/snake-light.svg
          vb=$(grep -o 'viewBox="[^"]*"' "$f" | head -1 | sed 's/viewBox="//; s/"$//')
          set -- $vb
          sed -i "0,/<\/style>/s|</style>|</style><rect x=\"$1\" y=\"$2\" width=\"$3\" height=\"$4\" fill=\"#ffffff\"/>|" "$f"
          grep -c 'fill="#ffffff"' "$f"
          ls -l dist
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
