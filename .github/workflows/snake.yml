name: Generate Snake

on:
  schedule:
    # Avoid minute 0 where GitHub scheduled workflows are most prone to delay.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # paper palette — sepia contribution dots, an ink snake
          outputs: |
            dist/snake.svg?color_dots=%23e7e0d0,%23cfc0a0,%23ad9770,%23846f50,%234f4231&color_snake=%232a2622&color_dot_border=%23f4efe4
      - name: Paint the paper (snk emits a transparent SVG)
        run: |
          f=dist/snake.svg
          vb=$(grep -o 'viewBox="[^"]*"' "$f" | head -1 | sed 's/viewBox="//; s/"$//')
          set -- $vb
          sed -i "0,/<\/style>/s|</style>|</style><rect x=\"$1\" y=\"$2\" width=\"$3\" height=\"$4\" fill=\"#f4efe4\"/>|" "$f"
          grep -c 'fill="#f4efe4"' "$f"
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
