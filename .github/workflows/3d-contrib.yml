name: 3D Contribution Graph

on:
  schedule:
    # Avoid minute 0 where GitHub scheduled workflows are most prone to delay.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # latex palette — black floor, crimson towers (see conf/)
          SETTING_JSON: conf/3d-contrib-latex.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ledger plate (contributions · streaks, house style)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli
          python assets/latex/ledger.py
      - name: Commit & Push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A profile-3d-contrib assets/latex/ledger.svg
          git commit -m "chore: update 3D contribution graph + ledger" || exit 0
          git push
