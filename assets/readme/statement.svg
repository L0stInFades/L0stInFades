<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214" role="img" aria-label="I labour at the margins of computing: in the building of engines for games, the verification of mathematics, and the composing of algorithms into music. Each undertaking is an endeavour to find that precise language which a problem deserves."><title>I labour at the margins of computing: in the building of engines for games, the verification of mathematics, and the composing of algorithms into music. Each undertaking is an endeavour to find that precise language which a problem deserves.</title><style>@font-face{font-family:'PgGaramond';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PgCormorant';src:url(data:font/woff2;base64,) format('woff2');}</style><defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity=".055"/><stop offset=".08" stop-color="#000" stop-opacity="0"/>
  <stop offset=".92" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".055"/>
</linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/>
  <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .26  0 0 0 0 .18  .045 .045 .045 0 0"/>
</filter>
</defs><rect width="900" height="214" fill="#f4efe4"/><rect width="900" height="214" fill="url(#edge)"/><rect width="900" height="214" filter="url(#grain)"/><text x="170.0" y="126.0" font-family="PgCormorant" font-size="111.52" fill="#1f1c17" text-anchor="start" >I</text><text x="221.8" y="68.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" word-spacing="0.75">labour at the margins of computing: in the building of engines for games,</text><text x="221.8" y="97.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >the verification of mathematics, and the composing of algorithms into</text><text x="221.8" y="126.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >music. Each undertaking is an endeavour to find that precise language</text><text x="170.0" y="155.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >which a problem deserves.</text></svg>