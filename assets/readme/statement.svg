<svg xmlns="http://www.w3.org/2000/svg" width="900" height="185" viewBox="0 0 900 185" role="img" aria-label="I work at the edges of computing — building game engines, verifying mathematics, composing algorithms into music. Each project is an attempt to find the precise language a problem deserves."><title>I work at the edges of computing — building game engines, verifying mathematics, composing algorithms into music. Each project is an attempt to find the precise language a problem deserves.</title><style>@font-face{font-family:'PgGaramond';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PgCormorant';src:url(data:font/woff2;base64,) format('woff2');}</style><defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity=".055"/><stop offset=".08" stop-color="#000" stop-opacity="0"/>
  <stop offset=".92" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".055"/>
</linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/>
  <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .26  0 0 0 0 .18  .045 .045 .045 0 0"/>
</filter>
</defs><rect width="900" height="185" fill="#f4efe4"/><rect width="900" height="185" fill="url(#edge)"/><rect width="900" height="185" filter="url(#grain)"/><text x="170.0" y="126.0" font-family="PgCormorant" font-size="111.52" fill="#1f1c17" text-anchor="start" >I</text><text x="221.8" y="68.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >work at the edges of computing — building game engines, verifying</text><text x="221.8" y="97.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >mathematics, composing algorithms into music. Each project is an</text><text x="221.8" y="126.0" font-family="PgGaramond" font-size="18.00" fill="#3d3831" text-anchor="start" >attempt to find the precise language a problem deserves.</text></svg>